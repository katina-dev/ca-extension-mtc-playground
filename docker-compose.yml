# Docker Compose for mtc-bridge in STANDALONE mode (no DigiCert CA).
#
# This compose file runs the bridge using only the local CA: ACME issuance,
# Merkle tree, visualizer, and proof endpoints all work end-to-end without
# any DigiCert dependency. New certs are appended to the issuance log
# directly by the ACME finalize handler (acme/finalize.go:184).
#
# Prereqs (run once):
#   make generate-key            # cosigner Ed25519 key
#   make generate-local-ca       # local CA key + cert
#   ./gen-demo-cert.sh           # ACME server TLS cert
#
# Usage:
#   docker compose up -d
#   docker compose logs -f mtc-bridge
#
# To re-enable DigiCert CA polling: set MTC_CADB_HOST/USERNAME/PASSWORD in
# .env and add `digicert-ca_default` external network back to both services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtcbridge
      POSTGRES_USER: mtcbridge
      POSTGRES_PASSWORD: ${MTC_POSTGRES_PASSWORD:-mtcbridge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mtcbridge" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mtc-internal

  mtc-bridge:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MTC_STATE_DB_HOST: postgres
      MTC_STATE_DB_PORT: "5432"
      MTC_STATE_DB_USERNAME: mtcbridge
      MTC_STATE_DB_PASSWORD: ${MTC_POSTGRES_PASSWORD:-mtcbridge}
      MTC_STATE_DB_DATABASE: mtcbridge
      # CADB intentionally unset — bridge runs in standalone mode.
      MTC_CADB_HOST: ""
      MTC_COSIGNER_KEY_FILE: /etc/mtc-bridge/keys/cosigner.key
      MTC_LOCAL_CA_KEY: /etc/mtc-bridge/keys/local-ca.key
      MTC_LOCAL_CA_CERT: /etc/mtc-bridge/keys/local-ca.pem
    volumes:
      - ./config.yaml:/etc/mtc-bridge/config.yaml:ro
      - ./keys:/etc/mtc-bridge/keys:ro
      - ./acme-cert.pem:/etc/mtc-bridge/acme-cert.pem:ro
      - ./acme-key.pem:/etc/mtc-bridge/acme-key.pem:ro
    ports:
      - "${MTC_HTTP_PORT:-8080}:8080"
      - "8443:8443"
    networks:
      - mtc-internal
    restart: unless-stopped

volumes:
  pgdata:

networks:
  mtc-internal:
    driver: bridge
